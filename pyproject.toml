[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolightning"
version = "0.2.0"
description = "Multi-task and multi-modal remote-sensing deep learning framework"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "src/data/torchgeo/LICENSE",
  "src/models/backbones/torchvision_source/LICENSE",
]
authors = [{name = "GeoLightning Team"}]
keywords = ["deep-learning", "pytorch", "lightning", "remote-sensing", "geospatial"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "hydra-core==1.3.2",
  "numpy==1.24.4",
  "omegaconf==2.3.0",
  "packaging==24.2",
  "pandas==2.0.3",
  "Pillow==12.3.0",
  "rich==13.9.4",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
train = [
  "einops==0.8.2",
  "lightning @ https://codeload.github.com/Lightning-AI/pytorch-lightning/tar.gz/fcef404516264798b6c582ef556eaa17e5c29bfb",
  "matplotlib==3.10.8",
  "opencv-python==4.10.0.84",
  "rootutils==1.0.7",
  "scikit-image==0.21.0",
  "seaborn==0.13.2",
  "swanlab==0.9.4",
  "tensorboard==2.14.0",
  "torch==2.13.0",
  "torchmetrics==1.5.2",
  "torchvision==0.28.0",
  "wandb==0.28.2",
]
geo = [
  "fiona==1.10.1",
  "geopandas==1.1.4",
  "pyproj==3.5.0",
  "rasterio==1.3.10",
  "rtree==1.3.0",
  "shapely==2.0.7",
]
datasets = [
  "h5py==3.11.0",
  "laspy>=2.5,<3",
  "pycocotools>=2.0.7,<3",
  "rarfile>=4.2,<5",
  "zarr==2.16.1",
  "zipfile-deflate64>=0.2,<1",
]
mlhub-legacy = [
  "radiant-mlhub==0.5.5",
]
dev = [
  "black==26.5.1",
  "build==1.2.2.post1",
  "isort==5.13.2",
  "mypy==1.14.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==5.0.0",
  "ruff==0.9.10",
  "tomli==2.4.1; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/WangHrYii/GeoLightning"
Issues = "https://github.com/WangHrYii/GeoLightning/issues"

[project.scripts]
geolightning-train = "src.cli:train_cli"
geolightning-eval = "src.cli:eval_cli"
geolightning-inference = "src.cli:inference_cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
configs = ["**/*.yaml", "**/.gitkeep"]
"src.data.torchgeo" = ["LICENSE", "UPSTREAM.md"]
"src.models.backbones.torchvision_source" = ["LICENSE", "UPSTREAM.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple repository components",
  "slow: long-running training, download, or multi-process test",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/models/SegmentationTask/utils/bricks/__init__.py" = ["F401", "I001"]
