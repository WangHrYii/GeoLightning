task_name: TreeHeightUnet
tags:
- dev
train: true
test: true
ckpt_path: /home/whr/Codes/CLFoundation/CLFoundation/outputs/2025-01-13/17-25-32/checkpoints/last.ckpt
seed: null
train_data:
  _target_: src.data.MTaskSemSegDataset.TreeHeightDataset
  images_dir: /mnt/data/Tree/TreeHeight/raster_1m_crop_02_256
  mask_dir: /mnt/data/Tree/TreeHeight/tree_cover_crop_02_256
  assist_dir: /mnt/data/Tree/TreeHeight/nDSM_crop_02_256
  scale: 1
  mask_values: [0, 101]
  batch_size: 8
infra_data:
  _target_: src.data.Infra_RSTiledPredDataset.RSTiledPredDatasetLD
  file_path: /mnt/data/Tree/TreeHeight/raster_1m_cropped_boundary.tif
  patch_size: 256
  overlap: 0.25
  batch_size: 8
  num_workers: 4
model:
  _target_: src.models.MheadUnet.MHeadUnet.MheadUNetLM
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.00003
    weight_decay: 0.0
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true  # _partial_ 的作用是将参数传递给父级，便于override
    mode: min
    factor: 0.1
    patience: 5
  net:
    _target_: src.models.MheadUnet.MHeadUnet.MheadUNet
    n_channels: 5
    n_classes: 2
  compile: false
callbacks:
  model_checkpoint:  # 内置的回调函数，用于保存模型
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: val_f1+val_r2
    verbose: false
    save_last: true
    save_top_k: 1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  early_stopping:    # 内置的回调函数，用于提前停止训练
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_f1+val_r2
    min_delta: 0.0
    patience: 100
    verbose: false
    mode: max
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: null
  infra_callback:
    _target_: src.callbacks.Infra_RSTiledPredCallback.PredictionCallback
    output_path: ${paths.output_dir}/prediction_results.tif
    overlap: ${infra_data.overlap}   # 与数据集的overlap对应, ${} 用于引用其他配置, 便于修改
    task_names: ["height", "cover"]  # 与模型的多头输出对应
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
logger:
  wandb:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: "tree_height_unet"
    # 设置name和学习率以及一些其他的参数
    name: lr:${model.optimizer.lr}_batch:${train_data.batch_size}
    save_dir: ${paths.log_dir}
    log_model: false
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 10
  max_epochs: 50
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  deterministic: false
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: true
  enforce_tags: true
  print_config: true
