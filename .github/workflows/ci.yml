name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Bootstrap packaging tools
        run: >-
          python -m pip install --upgrade
          pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
      - name: Install CPU PyTorch
        run: >-
          python -m pip install torch==2.13.0 torchvision==0.28.0
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install GeoLightning
        run: python -m pip install -e ".[train,geo,datasets,dev]"
      - name: Check package build
        run: python -m build
      - name: Run CPU test suite
        run: pytest -m "not slow"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit declared dependencies
        env:
          PIP_AUDIT_LOGLEVEL: ERROR
        run: |
          python tools/export_audit_requirements.py /tmp/direct-dependencies.txt
          python -m pip_audit --disable-pip --no-deps -r /tmp/direct-dependencies.txt
      - name: Audit installed environment
        # The pinned Lightning source contains the fix, but its generated
        # package version does not encode the post-release security commit.
        run: python -m pip_audit --skip-editable --ignore-vuln PYSEC-2026-3624
